version: 2
updates:
  # NuGet packages across all server projects (EF Core, Identity, Sentry, etc.)
  - package-ecosystem: "nuget"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]

  # npm packages for the web app (Next.js, React, Sentry, Tailwind, etc.)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]

  # Keep workflow actions current (checkout, setup-dotnet, setup-node, paths-filter,
  # docker actions)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]
