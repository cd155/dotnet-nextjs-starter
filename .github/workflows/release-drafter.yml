name: Release Drafter

# Drafts the next release on GitHub from the PRs merged into main since the last published one, by their labels
# (.github/release-drafter.yml). Run it by hand to refresh the draft; it isn't triggered on every merge, because
# each run costs a billed minute. Publish the draft on GitHub when you're ready.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_release_draft:
    name: Update draft release notes
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to create/update the draft release
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
